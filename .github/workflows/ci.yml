name: CI

# Three jobs, split by what they answer and what they cost.
#
#   checks     is the code correct and typed? Synthetic data, about a minute.
#   benchmark  do the small datasets still produce their numbers? A real download and a
#              real fit, a few minutes.
#   hillstrom  the twenty-minute reproduction check: rerun the benchmark and assert the
#              committed numbers come back. Weekly and on demand rather than on every push.
#
# Lenta and Criteo are deliberately not reproduced here (PLAN.md change 31). A GitHub runner
# has four cores against the twelve this was built on, and a hard six-hour job limit; Criteo
# alone ran four hours locally. Their CI job loads them and checks the pipeline instead: row
# counts, arm balance, and that no post-treatment column reached the feature matrix. That is
# the question CI can afford to ask. Whether the numbers still reproduce is asked locally,
# against the committed results, with 'itx compare'.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 UTC on Mondays, which is a quiet time in Newfoundland.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  checks:
    name: ruff, mypy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13 and the project
        run: uv sync --all-groups --extra learners

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  benchmark:
    name: IHDP and ACIC benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13 and the project
        run: uv sync --all-groups --extra learners

      # Keyed on the committed checksums: if a digest changes the cache is a miss and the
      # file is downloaded and verified again, which is the point of committing them.
      - name: Cache the raw downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/itx/data/checksums.sha256') }}

      - name: Pull and verify the datasets these jobs need
        run: >-
          uv run itx data pull hillstrom ihdp-train ihdp-test acic-x
          acic-zymu-1 acic-zymu-2 acic-zymu-3 acic-zymu-4

      # --run-slow and not --run-large. The large-dataset tests call load_criteo and
      # load_lenta, and fetch() downloads on a cache miss rather than failing, so an
      # unscoped --run-slow pulled 435 MB here and rebuilt the Criteo subsample: the exact
      # work the header says this job does not do (PLAN.md change 33).
      - name: Tests that need real data
        run: uv run pytest -q --run-slow

      - name: IHDP benchmark
        run: uv run itx benchmark --dataset ihdp

      - name: ACIC benchmark
        run: uv run itx benchmark --dataset acic

      - name: Keep the results and the figures
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            docs/figures/
          if-no-files-found: error

  hillstrom:
    name: Hillstrom reproduction
    # The long one. Every push would spend twenty minutes re-proving a number that only
    # moves when the estimators or the protocol move.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATASET: hillstrom
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13 and the project
        run: uv sync --all-groups --extra learners

      - name: Cache the raw downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ env.DATASET }}-${{ hashFiles('src/itx/data/checksums.sha256') }}

      - name: Pull and verify the dataset
        run: uv run itx data pull ${{ env.DATASET }}

      # Kept before the run overwrites it, so the comparison below has something to compare
      # against. Outside the working tree so it cannot be picked up as a result.
      - name: Keep the committed results
        run: cp results/${{ env.DATASET }}.json "${RUNNER_TEMP}/committed.json"

      - name: Benchmark
        run: uv run itx benchmark --dataset ${{ env.DATASET }}

      # The committed numbers have to match what a rerun produces. Not a file diff: the
      # results file records fit_seconds, which is wall-clock and never reproduces, so a
      # diff would fail every run for a reason that has nothing to do with the numbers
      # (PLAN.md change 28). 'itx compare' ignores timings and names what moved.
      - name: The committed numbers still match a fresh run
        run: uv run itx compare "${RUNNER_TEMP}/committed.json" results/${{ env.DATASET }}.json

      - name: The committed table still matches a fresh run
        run: git diff --exit-code -- README.md

      - name: Keep the results and the figures
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATASET }}-results
          path: |
            results/
            docs/figures/
          if-no-files-found: error

  large-datasets:
    name: Lenta and Criteo pipeline
    # Not a reproduction check: see the header and PLAN.md change 31. This loads both large
    # datasets and asserts the properties that would break silently if the source files
    # changed or a loader regressed, which is what CI can afford on a four-core runner.
    # 435 MB of downloads, so it is scheduled rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13 and the project
        run: uv sync --all-groups --extra learners

      - name: Cache the raw downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-large-${{ hashFiles('src/itx/data/checksums.sha256') }}

      - name: Pull and verify Criteo and Lenta
        run: uv run itx data pull criteo lenta

      # Row counts, the published arm and outcome rates, the stratified subsample matching
      # the full file, gender coding, missingness left alone, and that neither dataset's
      # post-treatment columns reached the feature matrix.
      - name: The loaders still produce the datasets the cards describe
        run: uv run pytest tests/test_large_datasets.py -q --run-large
