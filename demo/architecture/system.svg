<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="758" viewBox="0 0 1142 758" role="img" aria-label="Six public datasets are loaded with checksums and split on committed seeds; five meta-learners, Dragonnet and two baselines rank people through one interface; the metrics score every ranking with bootstrap intervals, the policy layer turns a ranking into an allocation, the sensitivity analysis says how much hidden confounding would flip it, and the benchmark runner writes the results and the demo." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
