<text x="561.0" y="380.0" font-size="12" text-anchor="middle" fill="#14201E">chosen parameters</text>
<rect x="479.0" y="480.0" width="164.1" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="561.0" y="492.0" font-size="12" text-anchor="middle" fill="#14201E">ranking, outcomes, treatment</text>
<rect x="516.6" y="592.0" width="88.7" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="561.0" y="604.0" font-size="12" text-anchor="middle" fill="#14201E">point estimates</text>
<rect x="514.0" y="704.0" width="94.0" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="561.0" y="716.0" font-size="12" text-anchor="middle" fill="#14201E">per-seed results</text>
