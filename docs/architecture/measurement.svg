<path d="M 561.0 242.0 L 561.0 290.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 561.0 354.0 L 561.0 402.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 561.0 466.0 L 561.0 514.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 561.0 578.0 L 561.0 626.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 561.0 690.0 L 561.0 738.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 561.0 802.0 L 561.0 850.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 692.0 882.0 L 832.0 882.0" fill="none" stroke="#14201E" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="430.0" y="66.0" width="262.0" height="64.0" rx="4" fill="#F2F4F3" stroke="#5C6B67" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="561.0" y="87.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">One dataset</text>
<text x="561.0" y="103.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">randomised, or simulated with truth</text>
<text x="561.0" y="120.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">docs/data/&lt;name&gt;.md</text>
<rect x="430.0" y="178.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="561.0" y="199.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">One of five committed seeds</text>
<text x="561.0" y="215.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">train, validation, test</text>
<text x="561.0" y="232.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.data.splits</text>
<rect x="430.0" y="290.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="561.0" y="311.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Hyperparameters on validation</text>
<text x="561.0" y="327.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">identical grid for every estimator</text>
<text x="561.0" y="344.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.bench.grid</text>
<rect x="430.0" y="402.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<rect x="430.0" y="402.0" width="5" height="64.0" rx="2" fill="#0E6E60"/>
<text x="561.0" y="423.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Fit on train, rank the test split</text>
<text x="561.0" y="439.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">the test split is touched once</text>
<text x="561.0" y="456.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.estimators</text>
<rect x="430.0" y="514.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="430.0" y="514.0" width="5" height="64.0" rx="2" fill="#A64C1C"/>
<text x="561.0" y="535.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Score the ranking</text>
<text x="561.0" y="551.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Qini, AUUC, policy value by IPW and DR</text>
<text x="561.0" y="568.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.metrics</text>
<rect x="430.0" y="626.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="430.0" y="626.0" width="5" height="64.0" rx="2" fill="#A64C1C"/>
<text x="561.0" y="647.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Bootstrap over rows</text>
<text x="561.0" y="663.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">95% interval on every number</text>
<text x="561.0" y="680.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.metrics.bootstrap</text>
<text x="159.0" y="542.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">Known individual effects</text>
<text x="159.0" y="558.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">IHDP and ACIC only</text>
<text x="963.0" y="542.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">Random and outcome-ranking</text>
<text x="963.0" y="558.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">beside every row</text>
<rect x="430.0" y="738.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="561.0" y="759.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Mean across the five seeds</text>
<text x="561.0" y="775.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">interval: mean of per-seed intervals</text>
<text x="561.0" y="792.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">itx.bench.runner</text>
<rect x="430.0" y="850.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="430.0" y="850.0" width="5" height="64.0" rx="2" fill="#A64C1C"/>
<text x="561.0" y="871.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The results table</text>
<text x="561.0" y="887.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">written by itx benchmark --dataset</text>
<text x="561.0" y="904.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">results/&lt;name&gt;.json, README</text>
<rect x="832.0" y="850.0" width="262.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="963.0" y="878.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Clean-environment rerun</text>
<text x="963.0" y="894.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">fresh clone, zero tolerance</text>
<rect x="544.3" y="144.0" width="33.3" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="561.0" y="156.0" font-size="12" text-anchor="middle" fill="#14201E">rows</text>
